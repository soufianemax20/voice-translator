name: flutter_voice_translator
description: Application de traduction vocale instantanée avec interface ultra-moderne
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^4.0.0
  
  # Audio
  record: ^5.0.4
  audioplayers: ^5.2.1
  permission_handler: ^11.1.0
  path_provider: ^2.1.1
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Config
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  
  # Crypto (pour AWS Signature V4)
  crypto: ^3.0.3
  
  # Utils
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
